.upload {

    padding: 15px;

}

    display: flex;
    flex-direction: column;

}

.pageWrapper {
    position: relative;
    margin-bottom: 20px;
    display: inline-block;
    z-index: 0;
}

canvas.pdfCanvas {
    border: 1px solid #ccc;
    background: white;
    position: relative;
    z-index: 1;
}

canvas.overlayCanvas {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index:2;
}
</style>

/* -----------------------------
   TIME DIFFERENCE (HH:MM)
----------------------------- */
function diffHM(dep, arr) {

    const dH = parseInt(dep.slice(0,2), 10);
    const dM = parseInt(dep.slice(2,4), 10);

    const aH = parseInt(arr.slice(0,2), 10);
    const aM = parseInt(arr.slice(2,4), 10);

    let total = (aH * 60 + aM) - (dH * 60 + dM);

    if (total < 0) total += 1440;

    return {
        hours: Math.floor(total / 60),
        mins: total % 60
    };
}

///NOTAM DATE FUNCTION
function parseNotamDate(dateStr, timeStr) {

    const months = {
        JAN:0,FEB:1,MAR:2,APR:3,MAY:4,JUN:5,
        JUL:6,AUG:7,SEP:8,OCT:9,NOV:10,DEC:11
    };

    const day = parseInt(dateStr.slice(0,2));
    const mon = months[dateStr.slice(3,6)];
    const year = 2000 + parseInt(dateStr.slice(7,9));

    const hour = parseInt(timeStr.slice(0,2));
    const min = parseInt(timeStr.slice(2,4));

    // UTC
    return new Date(Date.UTC(year, mon, day, hour, min));
}

function makeFlightDate(dateStr, timeStr) {

    const months = {
        JAN: 0, FEB: 1, MAR: 2, APR: 3, MAY: 4, JUN: 5,
        JUL: 6, AUG: 7, SEP: 8, OCT: 9, NOV: 10, DEC: 11
    };

    // Support both:
    // 24MAR26
    // 24-MAR-26
    const clean = dateStr.replace(/-/g, "").toUpperCase();

    const day = parseInt(clean.slice(0, 2));
    const month = months[clean.slice(2, 5)];
    const year = 2000 + parseInt(clean.slice(5, 7));

    const hour = parseInt(timeStr.slice(0, 2));
    const minute = parseInt(timeStr.slice(2, 4));

    return new Date(Date.UTC(year, month, day, hour, minute));
}

function makeWeatherDate(baseDate, value) {

    const day = parseInt(value.slice(0, 2));

    let hour = 0;
    let minute = 0;

    if (value.length === 6) {
        // DDHHMM
        hour = parseInt(value.slice(2, 4));
        minute = parseInt(value.slice(4, 6));
    }
    else if (value.length === 4) {
        // DDHH
        hour = parseInt(value.slice(2, 4));
    }
    else {
        return null;
    }

    // Start with flight month/year
    const d = new Date(Date.UTC(
        baseDate.getUTCFullYear(),
        baseDate.getUTCMonth(),
        day,
        hour,
        minute,
        0,
        0
    ));

    // Difference from flight date
    const diffDays =
        (d - baseDate) / (1000 * 60 * 60 * 24);

    // More than ~half a month ahead?
    if (diffDays > 15) {
        d.setUTCMonth(d.getUTCMonth() - 1);
    }

    // More than ~half a month behind?
    if (diffDays < -15) {
        d.setUTCMonth(d.getUTCMonth() + 1);
    }

    return d;
}

function drawPdfWindArrow(page, x, y, dirDeg, speed, font) {

    const windFrom = parseInt(dirDeg, 10);
    const angle = ((windFrom + 180) % 360) * Math.PI / 180;

    const length = 20;

    const x2 = x + Math.sin(angle) * length;
    const y2 = y + Math.cos(angle) * length;

    // Shaft
    page.drawLine({
        start: {
            x: x,
            y: y
        },
        end: {
            x: x2,
            y: y2
        },
        thickness: 1,
        color: PDFLib.rgb(0, 0, 1)
    });

    // Arrow head
    const head = 5;
    const left = angle - Math.PI / 6;
    const right = angle + Math.PI / 6;

    page.drawLine({
        start: {
            x: x2,
            y: y2
        },
        end: {
            x: x2 - Math.sin(left) * head,
            y: y2 - Math.cos(left) * head
        },
        thickness: 1,
        color: PDFLib.rgb(0, 0, 1)
    });

    page.drawLine({
        start: {
            x: x2,
            y: y2
        },
        end: {
            x: x2 - Math.sin(right) * head,
            y: y2 - Math.cos(right) * head
        },
        thickness: 1,
        color: PDFLib.rgb(0, 0, 1)
    });

    // Label
    page.drawText(
        `${dirDeg}°/${speed}`,
        {
            x: x - 8,
            y: y - 12,
            size: 6,
            font: font,
            color: PDFLib.rgb(0, 0, 1)
        }
    );
}

function addPdfPageLink(pdfDoc, page, targetPage, x, y, width, height) {

    const context = pdfDoc.context;

    const link = context.obj({
        Type: PDFLib.PDFName.of("Annot"),
        Subtype: PDFLib.PDFName.of("Link"),

        Rect: [
            x,
            y,
            x + width,
            y + height
        ],

        Border: [0, 0, 0],

        A: context.obj({
            S: PDFLib.PDFName.of("GoTo"),
            D: context.obj([
                targetPage.ref,
                PDFLib.PDFName.of("Fit")
            ])
        })
    });

    const linkRef = context.register(link);

    let annots = page.node.lookup(
        PDFLib.PDFName.of("Annots"),
        PDFLib.PDFArray
    );

    if (!annots) {

        annots = context.obj([]);

        page.node.set(
            PDFLib.PDFName.of("Annots"),
            annots
        );
    }

    annots.push(linkRef);
}

            pageNumber: p,

    ///LEGS EXTRACTION (VWS + HIGH GROUND + CLB)

    function summarizeTimeRanges(timeList) {

        const times = timeList
            .filter(t => /^\d{1,2}\.\d{2}$/.test(t))
            .map(t => {
                const [h, m] = t.split(".").map(Number);
                return h * 60 + m;
            })
            .sort((a, b) => a - b);

        if (!times.length) return [];

        const groups = [];
        let current = [times[0]];

        for (let i = 1; i < times.length; i++) {

            if (times[i] - times[i - 1] <= 45) {
                current.push(times[i]);
            } else {
                groups.push(current);
                current = [times[i]];
            }
        }

        groups.push(current);

        return groups.map(group => {

            let start = Math.floor(group[0] / 5) * 5;
            let end = Math.ceil(group[group.length - 1] / 5) * 5;

            const format = mins => {
                const h = Math.floor(mins / 60);
                const m = mins % 60;
                return `${h}:${String(m).padStart(2, "0")}`;
            };

            return `${format(start)} - ${format(end)}`;
        });

    ///FIRs

    function addWeatherBreaks(str) {

                      }
                  }

                  buf += " " + t2;

                  // count "=" occurrences

        return weatherLines;

    function drawWindArrow(octx, x, y, dirDeg, speed) {

        const windFrom = parseInt(dirDeg, 10);
        const angle = ((windFrom + 180) % 360) * Math.PI / 180;

        const length = 30;

        const x2 = x + Math.sin(angle) * length;
        const y2 = y - Math.cos(angle) * length;

        // line
        octx.strokeStyle = "blue";
        octx.lineWidth = 1;

        octx.beginPath();
        octx.moveTo(x, y);
        octx.lineTo(x2, y2);
        octx.stroke();

        // arrow head
        const head = 8;
        const left = angle - Math.PI / 6;
        const right = angle + Math.PI / 6;

        octx.beginPath();
        octx.moveTo(x2, y2);
        octx.lineTo(
            x2 - Math.sin(left) * head,
            y2 + Math.cos(left) * head
        );
        octx.lineTo(
            x2 - Math.sin(right) * head,
            y2 + Math.cos(right) * head
        );
        octx.closePath();
        octx.fillStyle = "blue";
        octx.fill();

        // label under arrow
        octx.fillStyle = "blue";
        octx.font = "10px Helvetica";
        octx.fillText(`${dirDeg}°/${speed}`, x - 10, y + 18);
    }

function parseIntamDate(str) {

    let year, month, day;

    if (str.length === 8) {
        year = Number(str.substring(0, 4));
        month = Number(str.substring(4, 6));
        day = Number(str.substring(6, 8));
    } else {
        year = 2000 + Number(str.substring(0, 2));
        month = Number(str.substring(2, 4));
        day = Number(str.substring(4, 6));
    }

    return new Date(year, month - 1, day);
}

function isRecentIntam(date) {

    const today = new Date();

    today.setHours(0,0,0,0);
    date.setHours(0,0,0,0);

    const diff = (today - date) / (1000 * 60 * 60 * 24);

    return diff >= 0 && diff <= 7;
}

function containsKeyword(text, keywords) {

    const upper = text.toUpperCase();

    return keywords.some(keyword => {

        const escaped = keyword
            .replace(/[.*+?^${}()|[\]\\]/g, "\\$&")
            .replace(/\s+/g, "\\s+");

        const regex = new RegExp(`\\b${escaped}\\b`, "i");

        return regex.test(upper);

    });

}

function shouldHighlightNotam(notam) {

    // ---------- NOTAM ID blacklist ----------
    if (NOTAM_BLACKLIST[notam.id]) {

    }

    // ---------- Keyword blacklist ----------
    if (containsKeyword(notam.text, NOTAM_BLACKWORDS)) {
        return false;
    }

    // ---------- Airport ----------
    const flightTime =
        notam.airportType === "departure"
            ? depDateTime
            : arrDateTime;

    // ---------- Validity ----------
    if (!isNotamValidForFlight(notam.valid, flightTime)) {
        return false;
    }

    // ---------- Keywords ----------
    const hasGroupA = containsKeyword(notam.text, GROUP_A);
    const hasGroupB = containsKeyword(notam.text, GROUP_B);

    return hasGroupA && hasGroupB;
}

function parseNotamValidity(validString) {

    const match = validString.match(
        /VALID:\s+(\d{2}-[A-Z]{3}-\d{2})\s+(\d{4})\s*-\s*(PERM|UFN|\d{2}-[A-Z]{3}-\d{2}\s+\d{4})/i
    );

    if (!match) return null;

    const [, startDate, startTime, endPart] = match;

    const start = makeFlightDate(startDate.toUpperCase(), startTime);

    let end;

    if (
        endPart.toUpperCase() === "PERM" ||
        endPart.toUpperCase() === "UFN"
    ) {

        end = new Date("2099-12-31T23:59:00Z");

    } else {

        const [endDate, endTime] = endPart.split(/\s+/);

        end = makeFlightDate(endDate.toUpperCase(), endTime);

    }

    return { start, end };
}

function isNotamValidForFlight(validString, flightTime) {

    const validity = parseNotamValidity(validString);

    if (!validity) return false;

    const windowStart = new Date(flightTime);
    const windowEnd = new Date(flightTime);

    windowStart.setUTCHours(windowStart.getUTCHours() - 1);
    windowEnd.setUTCHours(windowEnd.getUTCHours() + 1);

    return (
        validity.start <= windowEnd &&
        validity.end >= windowStart
    );
}

function resolveWeather(periods, time) {

    const sa = periods.find(p => p.type === "SA") || null;

    const ft = periods.find(p =>
        p.type === "FT" &&
        p.validFrom &&
        p.validTo &&
        time >= p.validFrom &&
        time <= p.validTo
    ) || null;

    let base = null;

    if (sa && sa.visibility) {
        base = sa;
    } else {
        base = ft || sa || periods[0] || null;
    }

    const overlays = [];

    for (const p of periods) {
        if (p === base) continue;

        if (p.validFrom && p.validTo) {
            if (time >= p.validFrom && time <= p.validTo) {
                overlays.push(p);
            }
        }
    }

    const baseCloud = getCloudBase(base);

    return {
        base,
        overlays,
        all: [base, ...overlays],
        cloudBase: baseCloud
    };
}

function resolveDestinationWeather(periods, time) {

    let base = null;
    const overlays = [];

    // STEP 1: ONLY FT is base candidate
    const ft = periods.find(p =>
        p.type === "FT" &&
        p.validFrom &&
        p.validTo &&
        time >= p.validFrom &&
        time <= p.validTo
    ) || null;

    base = ft || periods[0] || null;

    if (!base)
        return null;

    // STEP 2: overlays
    for (const p of periods) {

        if (p === base)
            continue;

        if (p.validFrom && p.validTo) {
            if (time >= p.validFrom && time <= p.validTo) {
                overlays.push(p);
            }
        }
    }

    const baseCloud = getCloudBase(base);

    return {
        base,
        overlays,
        all: [base, ...overlays],
        cloudBase: baseCloud
    };
}

const depAlerts = [];

function parseWeather(raw, baseDate) {

    const GROUP_STARTS = [
        "SA",
        "FT",
        "TEMPO",
        "INTER",
        "BECMG",
        "FM",
        "PROB30",
        "PROB40"
    ];

    const WEATHER_CODES = new Set([
        "RA","DZ","SHRA","SHDZ","+RA","+SHRA","-RA","-SHRA",
        "TS","TSRA","+TSRA","-TSRA","VCTS",
        "SN","SHSN","SG","PL","GR","GS","FZRA","FZDZ",
        "FG","BR","HZ","FU","DU","SA","VA",
        "SQ","FC","+FC","PO","DS","SS","NSW"
    ]);

    const tokens = raw
        .replace(/=/g, " = ")
        .trim()
        .split(/\s+/);

    const periods = [];

    let current = null;

    function finishCurrent() {
        if (current) {
            periods.push(current);
        }
    }

    for (const token of tokens) {

        //----------------------------------
        // New forecast group
        //----------------------------------
        if (GROUP_STARTS.includes(token)) {

            finishCurrent();

            current = {
                type: token,
                issue: null,
                validFrom: null,
                validTo: null,
                validFromText: null,
                validToText: null,
                wind: null,
                visibility: null,
                pressure: null,
                temperature: null,
                clouds: [],
                weather: [],
                other: [],
                raw: token
            };

            continue;
        }

        if (!current)
            continue;

        current.raw += " " + token;

        if (token === "=")
            continue;

        //----------------------------------
        // Issue time
        //----------------------------------
        if (
            current.issue === null &&
            /^\d{6}$/.test(token)
        ) {
            current.issueText = token;
            current.issue = makeWeatherDate(baseDate, token);
            continue;
        }

        //----------------------------------
        // Validity
        //----------------------------------
        if (/^\d{4}\/\d{4}$/.test(token)) {

            const [from, to] = token.split("/");

            current.validFromText = from;
            current.validToText = to;

            current.validFrom = makeWeatherDate(baseDate, from);
            current.validTo = makeWeatherDate(baseDate, to);

            if (current.validTo < current.validFrom) {
                current.validTo.setUTCMonth(
                    current.validTo.getUTCMonth() + 1
                );
            }
            continue;
        }

        //----------------------------------
        // Wind
        //----------------------------------
        if (/KT$|MPS$/.test(token)) {
            current.wind = token;
            continue;
        }

        //----------------------------------
        // Visibility (FIXED)
        //----------------------------------
        if (token === "CAVOK") {
            current.visibility = "CAVOK";
            continue;
        }

        if (/^\d{4}$/.test(token)) {
            current.visibility = token;
            continue;
        }

        const visMatch = token.match(/\b\d{4}\b/);
        if (visMatch && !current.visibility) {
            current.visibility = visMatch[0];
        }

        //----------------------------------
        // Pressure
        //----------------------------------
        if (/^Q\d{4}$/.test(token)) {
            current.pressure = token;
            continue;
        }

        //----------------------------------
        // Temperature / Dewpoint
        //----------------------------------
        if (/^M?\d{2}\/M?\d{2}$/.test(token)) {
            current.temperature = token;
            continue;
        }

        //----------------------------------
        // Clouds
        //----------------------------------
        if (/^(FEW|SCT|BKN|OVC|VV)/.test(token)) {
            current.clouds.push(token);
            continue;
        }

        //----------------------------------
        // Weather phenomena
        //----------------------------------
        if (WEATHER_CODES.has(token)) {
            current.weather.push(token);
            continue;
        }

        current.other.push(token);
    }

    finishCurrent();

    console.log("TOKENS:", tokens);
    console.log("PARSED:", periods);

    return periods;
}

///WX Applicable Forecast
function getApplicableForecast(periods, flightTime) {

                period.validFrom &&
                period.validTo &&
                flightTime >= period.validFrom &&
                flightTime <= period.validTo
            ) {
                base = period;
            }

            continue;
        }

        if (
            period.type === "TEMPO" ||

///VIS ANALYSIS (FIXED CAVOK LOGIC)
function analyseVisibility(applicable) {

    const alerts = [];

    if (!applicable)
        return alerts;

    const all = [
        ...(applicable.base ? [applicable.base] : []),
        ...(applicable.overlays || [])
    ];

    for (const period of all) {

        if (!period.visibility)
            continue;

        const vis = period.visibility;

        if (vis === "CAVOK") {
            alerts.push({
                type: "visibility",
                severity: "info",
                value: 10000,
                source: period.type,
                text: "CAVOK (≥10km visibility)"
            });
            continue;
        }

        const numVis = parseInt(vis, 10);

        if (isNaN(numVis))
            continue;

        if (numVis === 9999) {
            alerts.push({
                type: "visibility",
                severity: "info",
                value: 9999,
                source: period.type,
                text: "Visibility ≥10 km"
            });
            continue;
        }

        let severity = "info";

        if (numVis < 1500)
            severity = "warning";
        else if (numVis < 5000)
            severity = "caution";

        alerts.push({
            type: "visibility",
            severity,
            value: numVis,
            source: period.type,
            text: `Visibility ${numVis} m`
        });
    }

    return alerts;
}

///CLOUD BASE ANALYSIS
function getCloudBase(period) {

    if (!period)
        return null;

    if (!period.clouds || period.clouds.length === 0)
        return null;

    // No cloud / No significant cloud
    if (
        period.clouds.includes("NCD") ||
        period.clouds.includes("NSC")
    ) {
        return null;
    }

    let lowest = null;

    for (const c of period.clouds) {

        // Extract cloud type and height
        // e.g. BKN020, OVC005, VV002
        const match = c.match(/^(FEW|SCT|BKN|OVC|VV)(\d{3})$/);

        if (!match)
            continue;

        const type = match[1];
        const height = parseInt(match[2], 10) * 100; // feet

        // Vertical visibility always defines the ceiling
        if (type === "VV") {
            return {
                base: height,
                isVertical: true
            };
        }

        // Ceiling is the lowest BKN or OVC layer
        if (type === "BKN" || type === "OVC") {

            if (lowest === null || height < lowest) {
                lowest = height;
            }
        }
    }

    if (lowest === null)
        return null;

    return {
        base: lowest,
        isVertical: false
    };
}

///RWY EXTRACTION
function extractRunways(pages) {

    const items = pages[0].items;
    const runways = [];

    for (const item of items) {

        const match = item.str.match(/[A-Z]{4}\/(\d{2}[LRC]?)/);

        if (match) {
            runways.push(match[1]);
        }
    }

    return {
        departure: runways[0] || null,
        arrival: runways[1] || null
    };
}

///RUNWAY HEADING
function runwayHeading(runway) {

    if (!runway)
        return null;

    const number = parseInt(runway, 10);

    if (isNaN(number))
        return null;

    // Runway 36 = 360°
    if (number === 36)
        return 360;

    return number * 10;
}

///WINDS
function parseWind(windString, other = []) {

    if (!windString)
        return null;

    const result = {
        direction: null,
        speed: 0,
        gust: null,
        variable: false,
        variableRange: null
    };

    // VRB
    if (windString.startsWith("VRB")) {
        result.variable = true;

        const m = windString.match(/^VRB(\d{2,3})(KT|MPS)$/);

        if (m)
            result.speed = parseInt(m[1], 10);
    }
    else {

        const m = windString.match(/^(\d{3})(\d{2,3})(G(\d{2,3}))?(KT|MPS)$/);

        if (m) {
            result.direction = parseInt(m[1], 10);
            result.speed = parseInt(m[2], 10);

            if (m[4])
                result.gust = parseInt(m[4], 10);
        }
    }

    // Direction variation (240V310)
    const vr = other.find(x => /^\d{3}V\d{3}$/.test(x));

    if (vr) {

        const [from, to] = vr.split("V");

        result.variableRange = {
            from: parseInt(from, 10),
            to: parseInt(to, 10)
        };
    }

    return result;
}

function analyseWind(period, runwayHeading) {
    const alerts = [];

    if (!period || !period.wind)
        return alerts;

    const wind = parseWind(period.wind, period.other);

    if (!wind)
        return alerts;

    // -------------------
    // Strong wind
    // -------------------
    if (wind.speed >= 25) {

        alerts.push({
            severity: "caution",
            text: `Strong wind (${wind.speed} kt)`
        });
    }

    // -------------------
    // Gusts
    // -------------------
    if (wind.gust !== null) {

        alerts.push({
            severity: "warning",
            text: `Wind gusts to ${wind.gust} kt`
        });
    }

    // -------------------
    // VRB
    // -------------------
    if (wind.variable) {

        alerts.push({
            severity: "warning",
            text: "Variable wind (possible tailwind or runway change)"
        });
    }

    // -------------------
    // Variable direction
    // -------------------
    if (wind.variableRange) {

        alerts.push({
            severity: "caution",
            text: `Wind direction variable ${wind.variableRange.from}°–${wind.variableRange.to}°`
        });
    }

    // -------------------
    // Crosswind
    // -------------------
    if (wind.direction !== null && wind.speed >= 10) {
        let diff = Math.abs(wind.direction - runwayHeading);

        if (diff > 180)
            diff = 360 - diff;

        if (diff > 60) {
            alerts.push({
                severity: "caution",
                text: `Crosswind (${diff}° off runway)`
            });
        }
    }

    return alerts;
}

///TEMPERATURE ANALYSIS
function analyseTemperature(period) {

    const alerts = [];

    if (!period || !period.temperature)
        return alerts;

    const tempText = period.temperature.split("/")[0];

    // M02 -> -2
    const temperature = tempText.startsWith("M")
        ? -parseInt(tempText.slice(1), 10)
        : parseInt(tempText, 10);

    if (isNaN(temperature))
        return alerts;

    // -------------------
    // Very hot
    // -------------------
    if (temperature > 40) {

        alerts.push({
            severity: "warning",
            text: `Very hot (${temperature}°C)`
        });

    }
    // -------------------
    // Hot
    // -------------------
    else if (temperature > 33) {

        alerts.push({
            severity: "caution",
            text: `Hot (${temperature}°C)`
        });
    }

    // -------------------
    // Very cold
    // -------------------
    if (temperature < -15) {

        alerts.push({
            severity: "warning",
            text: `Very cold (${temperature}°C)`
        });

    }
    // -------------------
    // Below freezing
    // -------------------
    else if (temperature < 0) {

        alerts.push({
            severity: "warning",
            text: `Below freezing (${temperature}°C)`
        });

    }
    // -------------------
    // Cold
    // -------------------
    else if (temperature < 10) {

        alerts.push({
            severity: "caution",
            text: `Cold (${temperature}°C) - potential icing`
        });
    }

    return alerts;
}

///THUNDERSTORM ANALYSIS
function analyseThunderstorms(period) {

    const alerts = [];

    if (!period)
        return alerts;

    // -------------------
    // Thunderstorm weather
    // -------------------
    const wx = period.weather || [];

    if (
        wx.includes("TS") ||
        wx.includes("TSRA") ||
        wx.includes("+TSRA") ||
        wx.includes("-TSRA") ||
        wx.includes("VCTS")
    ) {

        alerts.push({
            severity: "warning",
            text: "Thunderstorms"
        });
    }

    // -------------------
    // Convective clouds
    // -------------------
    const clouds = period.clouds || [];

    const hasCB = clouds.some(c => c.includes("CB"));
    const hasTCU = clouds.some(c => c.includes("TCU"));

    if (hasCB) {

        alerts.push({
            severity: "warning",
            text: "Cumulonimbus (CB)"
        });

    } else if (hasTCU) {

        alerts.push({
            severity: "warning",
            text: "Towering Cumulus (TCU)"
        });

    }

    return alerts;
}


///PRESSURE ANALYSIS
function analysePressure(period, phase) {

            severity: "caution",
            text: `Low pressure (QNH ${qnh})`
        });
    }

    // -------------------
    // Transition pressure change
    // -------------------
    const delta = (qnh - 1013) * 27;   // signed altitude difference (ft)

    if (delta !== 0) {

        if (phase === "departure") {

            alerts.push({
                severity: "info",
                text: delta > 0
                    ? `${delta} ft lost changing to STD`
                    : `${-delta} ft gained changing to STD`
            });

        } else {

            alerts.push({
                severity: "info",
                text: delta > 0
                    ? `${delta} ft gained changing to QNH`
                    : `${-delta} ft lost changing to QNH`
            });

        }
    }

    return alerts;
}

function buildWeatherLines(...groups) {

    const lines = [];
    const infoLines = [];

    for (const group of groups) {

        if (!group)
            continue;

        for (const alert of group) {

            if (
                alert.severity === "warning" ||
                alert.severity === "caution"
            ) {
                lines.push(alert.text);
            }

            else if (
                alert.severity === "info" &&
                (
                    alert.text.includes("changing to STD") ||
                    alert.text.includes("changing to QNH")
                )
            ) {
                infoLines.push(alert.text);
            }
        }
    }

    // No cautions/warnings -> GOOD WEATHER first
    if (lines.length === 0) {
        lines.push("GOOD WEATHER");
    }

    // Always append QNH transition information afterwards
    lines.push(...infoLines);

    return lines;
}

//=====================================================
// EXTRACT HIGH GROUND WAYPOINTS
//=====================================================

async function extractHighGroundWaypoints(ofpFile){

    const pdf = await pdfjsLib.getDocument({
        data: await ofpFile.arrayBuffer()
    }).promise;

    const waypoints = [];
    const seen = new Set();

    // Keep every page's token list so we can search it later
    const pageWords = [];

    //--------------------------------------------------
    // PASS 1 - Extract all high ground waypoints
    //--------------------------------------------------

    for (let p = legsStartPage; p <= legsEndPage; p++) {

        const pg = pages[p - 1];

        const words = pg.text.split(/\s+/);

        pageWords.push(words);

        for(let i = 0; i < words.length; i++){

            const token = words[i];

            // Terrain code e.g. 111*0000
            if(/\d{3}\*\d{4}/.test(token)){

                const waypoint = words[i - 17];

                if(
                    waypoint &&
                    /^[A-Z0-9]{2,6}$/.test(waypoint) &&
                    !seen.has(waypoint)
                ){

                    seen.add(waypoint);
                    waypoints.push(waypoint);

                }
            }
        }
    }

    //--------------------------------------------------
    // PASS 2 - Insert waypoint before each new segment
    //--------------------------------------------------

    const invalidWords = new Set([
        "POSN","FREQ","ACTM","ZTM","ATA","AFL","ETA","OAT",
        "ADN","AWIND","TAS","VWS","ZFRQ","AFRM","COORD",
        "MSA","DIS","PFL","RETA","IMT","PDN","FWIND",
        "GSP","DRM","PFRM","DIFF","ZFW","TOTAL","DCT",
        "PRFM", "CFP"
    ]);

    for(let k = 0; k < waypoints.length; k++){

        const currentWaypoint = waypoints[k];

        let previousWaypoint = null;

        outer:

        for(const words of pageWords){

            for(let i = 0; i < words.length; i++){

                if(words[i] !== currentWaypoint)
                    continue;

                // Walk backwards until we find a valid waypoint
                for(let j = i - 1; j >= 0; j--){

                    const token = words[j].replace(/^-/, "").trim();

                    const validLength =
                        token.length === 2 ||
                        token.length === 3 ||
                        token.length === 5;

                    const validLetters =
                        /^[A-Z]+$/.test(token);

                    if(
                        validLength &&
                        validLetters &&
                        !invalidWords.has(token)
                    ){
                        previousWaypoint = token;
                        break outer;
                    }

                }

            }

        }

        if(
            previousWaypoint &&
            !waypoints.includes(previousWaypoint)
        ){

            console.log(
                "Inserted",
                previousWaypoint,
                "before",
                currentWaypoint
            );

            waypoints.splice(k,0,previousWaypoint);

            k++;

        }

    }

    console.log("High Ground Waypoints");
    console.log(waypoints);

    return waypoints;

}

//=====================================================
// FIND DECOMPRESSION PROFILES
//=====================================================

async function findDecompressionProfiles(highGroundWaypoints){

    const PDF_PATH = "./decompression_profiles.pdf";
    const START_PAGE = 13;
    const END_PAGE = 30;

    const pdf = await pdfjsLib.getDocument(PDF_PATH).promise;

    const matches = [];
    const candidateRoutes = [];

    //--------------------------------------------------
    // Helpers
    //--------------------------------------------------

    function isRoute(token){

        return /^[A-Z0-9]{2,6}\s+TO\s+[A-Z0-9]{2,6}$/.test(token);

    }

    function isProfile(token){

        return (
            /^[A-Z]{3,6}$/.test(token) ||
            /^[A-Z]{3,6}\s*\(\d+\)$/.test(token)
        );

    }

    function isAirway(token){

        return (
            token.includes("DCT") ||
            token.includes(",") ||
            /\b[A-Z]\d{2,3}\b/.test(token)
        );

    }

    function profileMatchesWaypoint(profile, highGroundWaypoints){

        const profileName =
            profile.replace(/\s*\(\d+\)$/, "");

        return highGroundWaypoints.includes(profileName);

    }

    function profileBaseName(profile){

        return profile.replace(/\s*\(\d+\)$/, "");

    }

    //--------------------------------------------------
    // PRIMARY ROUTE MATCH
    //--------------------------------------------------

    let waitingForProfile = false;
    let currentRoute = "";

    for (let p = START_PAGE; p <= END_PAGE; p++) {

        const pg = pages[p - 1];

        const tokens = pg.tokens.filter(Boolean);

        for(const token of tokens){

            if(waitingForProfile){

                if(isAirway(token))
                    continue;

                if(isProfile(token)){

                    matches.push({
                        route: currentRoute,
                        profile: token,
                        method: "ROUTE"
                    });

                    const r = candidateRoutes.find(
                        x => x.route === currentRoute
                    );

                    if(r)
                        r.found = true;

                    waitingForProfile = false;
                    currentRoute = "";

                }

                continue;

            }

            if(!isRoute(token))
                continue;

            const [start,,end] = token.split(/\s+/);

            const startIndex =
                highGroundWaypoints.indexOf(start);

            const endIndex =
                highGroundWaypoints.indexOf(end);

            if(
                startIndex !== -1 &&
                endIndex !== -1 &&
                startIndex < endIndex
            ){

                console.log("Route Match:", token);

                currentRoute = token;

                candidateRoutes.push({
                    route: token,
                    found: false
                });

                waitingForProfile = true;

            }

        }

    }

    //--------------------------------------------------
    // FALLBACK PROFILE MATCH
    //--------------------------------------------------

    for (let p = START_PAGE; p <= END_PAGE; p++) {

        const pg = pages[p - 1];

        const tokens = pg.tokens.filter(Boolean);

        let lastRoute = null;

        for(const token of tokens){

            if(isRoute(token)){
                lastRoute = token;
                continue;
            }

            if(!isProfile(token))
                continue;

            if(!lastRoute)
                continue;

            if(!profileMatchesWaypoint(
                token,
                highGroundWaypoints
            ))
                continue;

            const [start,,end] =
                lastRoute.split(/\s+/);

            const endpointMatches =
                highGroundWaypoints.includes(start) ||
                highGroundWaypoints.includes(end);

            if(!endpointMatches)
                continue;

            const alreadyExists =
                matches.some(m =>
                    profileBaseName(m.profile) ===
                    profileBaseName(token)
                );

            if(alreadyExists)
                continue;

            matches.push({

                route: lastRoute,
                profile: token,
                method: "PROFILE"

            });

            console.log(
                "Fallback Match:",
                lastRoute,
                "=>",
                token
            );

        }

    }

    //--------------------------------------------------
    // CHART NOT FOUND
    //--------------------------------------------------

    for(const r of candidateRoutes){

        const exists =
            matches.some(
                m => m.route === r.route
            );

        if(!exists){

            matches.push({

                route: r.route,
                profile: "Chart not found",
                method: "NOT_FOUND"

            });

        }

    }

    console.log(matches);

    return matches;

}

        }
    }

    if (firAnnotation) {
        const page = pdfPages[firAnnotation.page];
        let y = page.getHeight() - (firAnnotation.y / 1.5);
        for (const a of firAnnotation.rows) {

            page.drawText(
                a.time || "",
                {
                    x: 65 / 1.5,
                    y,
                    size: 6,
                    font: unicodeFont,
                    color: PDFLib.rgb(0,0,1)
                }
            );

            page.drawText(
                `${a.fir || ""} - ${a.firName || ""}`,
                {
                    x: 100 / 1.5,
                    y,
                    size: 6,
                    font: unicodeFont,
                    color: PDFLib.rgb(0,0,1)
                }
            );

            page.drawText(
                a.waypoint || "",
                {
                    x: 230 / 1.5,
                    y,
                    size: 6,
                    font: unicodeFont,
                    color: PDFLib.rgb(0,0,1)
                }
            );

            if (a.fallbackTime) {

                page.drawText(
                    `(${a.fallbackTime})`,
                    {
                        x: 280 / 1.5,
                        y,
                        size: 6,
                        font: unicodeFont,
                        color: PDFLib.rgb(0,0,1)
                    }
                );
            }

            page.drawText(
                a.country || "",
                {
                    x: 320 / 1.5,
                    y,
                    size: 6,
                    font: unicodeFont,
                    color: PDFLib.rgb(0,0,1)
                }
            );

            y -= 10;
        }
    }

    if (weatherAnnotation) {

        const page = pdfPages[weatherAnnotation.page];

        const font = unicodeFont;

        let y =
            page.getHeight()
            - (weatherAnnotation.y / 1.5);


        for (const line of weatherAnnotation.lines) {


            if (line.highlight) {

                page.drawRectangle({
                    x: weatherAnnotation.x / 1.5 - 2,
                    y: y - 2,
                    width:
                        (line.text.length * 5.5) / 1.5,
                    height: 12,
                    color: PDFLib.rgb(
                        1,
                        0.92,
                        0.2
                    ),
                    opacity: 0.45
                });
            }


            page.drawText(
                line.text,
                {
                    x: weatherAnnotation.x / 1.5,
                    y: y,
                    size: 6,
                    font: font,
                    color: PDFLib.rgb(0,0,1)
                }
            );


            y -= 8;
        }
    }

    if (windArrowAnnotation) {

        const page = pdfPages[windArrowAnnotation.page];

        const scale = 1.5;
        const canvasHeight = windArrowAnnotation.canvasHeight;

        // =====================
        // CLIMB TITLE
        // =====================

        page.drawText(
            "CLB WINDS:",
            {
                x: 625 / scale,
                y: (canvasHeight - 1070) / scale,
                size: 7,
                font: unicodeFont,
                color: PDFLib.rgb(0, 0, 1)
            }
        );

        // =====================
        // CLIMB WINDS
        // =====================

        let x = windArrowAnnotation.clbX / scale;

        const clbY =
            (canvasHeight - windArrowAnnotation.clbY) / scale;

        for (const w of windArrowAnnotation.clbWinds) {

            drawPdfWindArrow(
                page,
                x,
                clbY,
                w.dir,
                w.spd,
                unicodeFont
            );

            x += 50 / scale;
        }

        // =====================
        // CLIMB FL LABELS
        // =====================

        x = 655 / scale;

        const clbLabelY =
            (canvasHeight - 1080) / scale;

        for (const fl of windArrowAnnotation.clbFls) {

            page.drawText(
                `FL${fl}`,
                {
                    x,
                    y: clbLabelY,
                    size: 5,
                    font: unicodeFont,
                    color: PDFLib.rgb(0, 0, 1)
                }
            );

            x += 50 / scale;
        }


        // =====================
        // DESCENT TITLE
        // =====================

        page.drawText(
            "DES WINDS:",
            {
                x: 625 / scale,
                y: (canvasHeight - 1150) / scale,
                size: 7,
                font: unicodeFont,
                color: PDFLib.rgb(0, 0, 1)
            }
        );

        // =====================
        // DESCENT WINDS
        // =====================

        x = windArrowAnnotation.desX / scale;

        const desY =
            (canvasHeight - windArrowAnnotation.desY) / scale;

        for (const w of windArrowAnnotation.desWinds) {

            drawPdfWindArrow(
                page,
                x,
                desY,
                w.dir,
                w.spd,
                unicodeFont
            );

            x += 50 / scale;
        }

        // =====================
        // DESCENT FL LABELS
        // =====================

        x = 655 / scale;

        const desLabelY =
            (canvasHeight - 1160) / scale;

        for (const fl of windArrowAnnotation.desFls) {

            page.drawText(
                `FL${fl}`,
                {
                    x,
                    y: desLabelY,
                    size: 5,
                    font: unicodeFont,
                    color: PDFLib.rgb(0, 0, 1)
                }
            );

            x += 50 / scale;
        }
    }

    if (crewBulletinAnnotation) {

        const page = pdfPages[crewBulletinAnnotation.page];

        drawPdfMultiline(
            page,
            crewBulletinAnnotation.lines,
            crewBulletinAnnotation.x,
            crewBulletinAnnotation.y,
            {
                font: unicodeFont,
                size: 10,
                color: PDFLib.rgb(1, 0, 0), // red
                lineHeight: 12
            }
        );
    }

    const scale = 1.5;

    for (const t of pageTitleAnnotations) {

        const page = pdfPages[t.page];

        page.drawText(
            t.text,
            {
                x: t.x / scale,
                y: (t.canvasHeight - t.y) / scale,
                size: 24,
                font: unicodeFont,
                color: PDFLib.rgb(1, 0, 0)
            }
        );
    }

    if (intamTitleAnnotation) {

        const page = pdfPages[intamTitleAnnotation.page];

        page.drawText(
            intamTitleAnnotation.text,
            {
                x: intamTitleAnnotation.x / scale,
                y: (intamTitleAnnotation.canvasHeight - intamTitleAnnotation.y) / scale,
                size: 24,
                font: unicodeFont,
                color: PDFLib.rgb(1, 0, 0)
            }
        );
    }


    if (bulletinAnnotation) {

        const page = pdfPages[bulletinAnnotation.page];;

        const pdfY =
            (bulletinAnnotation.canvasHeight - bulletinAnnotation.y) / scale;

        let y = bulletinAnnotation.y;

        for (let i = 0; i < bulletinAnnotation.lines.length; i++) {

            page.drawText(
                `${i + 1}. ${bulletinAnnotation.lines[i]}`,
                {
                    x: bulletinAnnotation.x / scale,
                    y: (bulletinAnnotation.canvasHeight - y) / scale,
                    size: 8,
                    font: unicodeFont,
                    color: PDFLib.rgb(0, 0, 1)
                }
            );

            y += bulletinAnnotation.lineHeight;
        }
    }














    const exportDoc = await PDFLib.PDFDocument.create();

    exportDoc.registerFontkit(fontkit);

    const exportFontBytes = await fetch("ARIAL.TTF")
        .then(res => res.arrayBuffer());

    const exportUnicodeFont = await exportDoc.embedFont(exportFontBytes);

    const pagesToKeep = [];

    // Always keep page 1 and 2
    pagesToKeep.push(0);
    pagesToKeep.push(1);

    // Keep all LEGS pages
    if (
        legsStartPage !== null &&
        legsEndPage !== null
    ) {
        for (
            let p = legsStartPage - 1;
            p <= legsEndPage - 1;
            p++
        ) {
            pagesToKeep.push(p);
        }
    }

    // Keep EDTO pages
    if (
        edtoStartPage !== null &&
        edtoEndPage !== null
    ) {
        for (
            let p = edtoStartPage - 1;
            p <= edtoEndPage - 1;
            p++
        ) {
            pagesToKeep.push(p);
        }
    }

    for (const p of forecastWindPages) {
        pagesToKeep.push(p - 1);
    }

    // Keep ATC Flight Plan page
    if (atcFlightPlanPage !== null) {
        pagesToKeep.push(atcFlightPlanPage - 1);
    }

    // Keep WX pages
    if (
        wxStartPage !== null &&
        wxEndPage !== null
    ) {
        for (
            let p = wxStartPage - 1;
            p <= wxEndPage - 1;
            p++
        ) {
            pagesToKeep.push(p);
        }
    }

    // Keep NOTAM pages
    if (
        notamStartPage !== null &&
        notamEndPage !== null
    ) {
        for (
            let p = notamStartPage - 1;
            p <= notamEndPage - 1;
            p++
        ) {
            pagesToKeep.push(p);
        }
    }

    // Keep Crew Bulletin pages to end of PDF
    if (crewBulletinStartPage !== null) {

        for (
            let p = crewBulletinStartPage - 1;
            p < pdfPages.length;
            p++
        ) {
            pagesToKeep.push(p);
        }

    }

    const copiedPages = await exportDoc.copyPages(
        pdfDoc,
        pagesToKeep
    );

    copiedPages.forEach(page => {
        exportDoc.addPage(page);
    });

    const pageMap = {};

    pagesToKeep.forEach((originalPage, index) => {
        pageMap[originalPage] = index;
    });

        for (const h of notamHighlights) {

        const exportPageIndex = pageMap[h.page];

        if (exportPageIndex === undefined)
            continue;

        const page = exportDoc.getPages()[exportPageIndex];

        const scale = 1.5;

        page.drawRectangle({
            x: h.x / scale - 2,

            y:
                page.getHeight()
                - ((h.y - 12) / scale)
                - (18 / scale),

            width:
                (h.width + 4) / scale,

            height:
                18 / scale,

            color: PDFLib.rgb(1,0.92,0.2),
            opacity: 0.45
        });
    }

    if (tocAnnotation) {

        const page = exportDoc.getPages()[0];

        const x = tocAnnotation.x / scale;

        let y =
            (tocAnnotation.canvasHeight - tocAnnotation.y) / scale;


        page.drawText("Quick Links:", {
            x,
            y,
            size: 8,
            font: exportUnicodeFont,
            color: PDFLib.rgb(0, 0, 1)
        });

        y -= tocAnnotation.lineHeight / scale;


        for (const entry of tocAnnotation.entries) {

            const mappedPage = pageMap[entry.page];

            const target =
                mappedPage !== undefined
                    ? exportDoc.getPages()[mappedPage]
                    : undefined;


            console.log("TOC LINK DEBUG:", {
                text: entry.text,
                originalPage: entry.page,
                mappedPage,
                target
            });


            if (!target) {
                console.warn(
                    "Skipping missing TOC target:",
                    entry
                );

                continue;
            }


            page.drawText(entry.text, {
                x,
                y,
                size: 8,
                font: exportUnicodeFont,
                color: PDFLib.rgb(0, 0, 1)
            });


            addPdfPageLink(
                exportDoc,
                page,
                target,
                x,
                y - 2,
                70,
                10
            );


            y -= tocAnnotation.lineHeight / scale;
        }
    }

    const bytes = await exportDoc.save();

    const fileName =
        dep && arr && date
            ? `${dep}${arr}${date}.pdf`
            : "Annotated_OFP.pdf";

    const blob = new Blob([bytes], {
        type: "application/pdf"
    });

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = fileName;
    a.click();

    URL.revokeObjectURL(url);
});

</script>
